[workspace]
members = [
  "programs/attention-oracle",
  "programs/wzrd-rails",
  "programs/wzrd-markets",
]
# Standalone so its opt-level 3 release profile is the one that builds.
# The workspace profile is opt-level z and would change the program binary.
exclude = ["programs/evidence-ledger"]
resolver = "2"

# Pin to avoid edition2024 breakage on SBF toolchain (Cargo 1.84)
[workspace.dependencies]
constant_time_eq = "=0.3.1"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
